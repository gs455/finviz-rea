name: After-hours snapshot
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 17:30 EDT / 16:30 EST
    - cron: "0 23 * * 1-5"    # 19:00 EDT / 18:00 EST
    - cron: "30 1 * * 2-6"    # 21:30 EDT / 20:30 EST (feed has caught up to 20:00)
  workflow_dispatch:
    inputs:
      date: { description: "Trading date YYYY-MM-DD (default: today in New York)", required: false }
jobs:
  ah:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.mjs
      - run: node jobs/ah.mjs ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
