<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finviz REA · Charts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topline">
    <a class="icon-btn" href="https://armanai.pages.dev" title="Home" aria-label="Home">&#8962;</a>
    <nav id="tabs" class="tabs"></nav>
    <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Menu">&#8943;</button>
    <button id="theme-btn" class="icon-btn" title="Light / dark" aria-label="Light / dark"></button>
    <div id="menu" class="menu" hidden>
      <button data-act="changelog">Changelog</button>
      <button data-act="history">Code history</button>
      <div class="menu-version" id="version"></div>
    </div>
  </header>

  <section class="filterbar">
    <button id="filters-btn" class="btn">Filters</button>
    <div id="filters-panel" class="filters-panel" hidden></div>
    <select id="preset" title="My presets (saved in this browser)"></select>
    <button id="preset-save" class="btn" title="Save the current screen as a preset">Save</button>
    <label>Order <select id="order"></select></label>
    <select id="dir"><option>Asc</option><option>Desc</option></select>
    <label>Signal <select id="signal"></select></label>
    <input id="tickers" class="tickers" placeholder="Tickers: AAPL, F, QS" spellcheck="false">
    <label>Price &gt; <input id="min-price" class="num" inputmode="decimal" title="Minimum price ($)"></label>
    <label>Avg vol &gt; <input id="min-avgvol" class="num" inputmode="decimal" title="Minimum average volume, in thousands"> K</label>
  </section>

  <section class="controls">
    <div id="tf" class="seg" role="group" aria-label="Timeframe"></div>
    <button id="ta-btn" class="btn" title="Tech. Analysis: none / support-resistance / trend lines">Tech. Analysis: none</button>
    <label>Refresh <select id="refresh"><option value="0">Off</option><option value="30">30s</option><option value="60">1m</option><option value="300">5m</option></select></label>
    <label>Layout <select id="layout"><option value="2x4">Default (2 x 4)</option><option value="2x3">2 x 3</option><option value="2x6">2 x 6</option></select></label>
    <span class="grow"></span>
    <span id="status" class="status"></span>
    <span id="pager" class="pager"></span>
  </section>

  <main id="grid" class="grid"></main>
  <section id="overview" class="overview" hidden></section>
  <div id="placeholder" class="placeholder" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><strong id="modal-title"></strong><span id="modal-tabs"></span><button id="modal-close" class="icon-btn" aria-label="Close">&times;</button></div><div id="modal-body" class="modal-body"></div></div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
